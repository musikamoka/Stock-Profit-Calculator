<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>股价盈亏实验室</title><style>
:root{color-scheme:dark;--bg:#0c1220;--panel:#141e30;--line:#2b3950;--muted:#9cacc3;--green:#45ddb0;--red:#ff8093}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf3ff;font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1440px;margin:auto;padding:30px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0 0 18px}.tag{font-size:14px;color:var(--muted)}.layout{display:grid;grid-template-columns:300px 1fr;gap:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}label{display:block;color:var(--muted);font-size:14px;margin-bottom:15px}input,select,button{font:inherit;color:inherit;background:#0d1626;border:1px solid #34435b;border-radius:8px;padding:10px;width:100%;margin-top:6px}input:focus,select:focus,button:focus-visible{outline:2px solid #7babff}button{cursor:pointer;background:#263f66}button:hover{background:#34527e}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.card{background:#18263c;border-radius:12px;padding:17px}.caption{font-size:14px;color:var(--muted)}.value{font-size:25px;font-weight:650;margin-top:5px;font-variant-numeric:tabular-nums}.positive{color:var(--green)}.negative{color:var(--red)}.charthead{display:flex;align-items:center;justify-content:space-between;gap:14px}.charthead h2{margin:0}canvas{width:100%;height:360px;display:block;touch-action:none;margin-top:12px}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-top:1px solid var(--line);padding-top:18px}.details strong{font-size:20px;display:block;margin-top:6px}.hint{font-size:14px;color:var(--muted);margin:14px 0 0}.target{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center;margin-top:20px}.target label{margin:0}.target strong{font-size:24px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px;margin-top:18px;text-align:right;white-space:nowrap}th,td{padding:12px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}th:first-child,td:first-child{text-align:left}details{margin-top:18px}summary{cursor:pointer;font-size:14px;color:var(--muted)}#error{color:var(--red);font-size:14px}footer{color:var(--muted);font-size:13px;margin-top:22px}.pill{color:#b9d4ff;background:#243650;border-radius:20px;padding:5px 12px;font-size:13px}@media(max-width:1000px){main{padding:18px}.layout{grid-template-columns:260px 1fr}.cards{grid-template-columns:1fr}.card{padding:12px}.value{font-size:22px}.details{grid-template-columns:1fr 1fr}}@media(max-width:700px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:repeat(3,1fr);gap:6px}.value{font-size:18px}.card{padding:10px}.panel{padding:16px}header{align-items:flex-start;gap:10px}h1{font-size:22px}.tag{display:none}canvas{height:310px}.charthead{display:block}.pill{display:inline-block;margin-top:8px}}
</style></head><body><main><header><div><h1>股价盈亏实验室</h1><span class="tag">把目标股价，换算成看得见的盈亏。</span></div><span class="pill">股票 · 多头持仓</span></header><div class="layout"><aside class="panel"><h2>你的持仓</h2><label>当前股价<input id="current" type="number" min="0.000001" step="any" value="50"></label><label>建仓成本 / 股<input id="cost" type="number" min="0.000001" step="any" value="45"></label><label>建仓规模按<select id="mode"><option value="shares">持仓股数</option><option value="amount">投入金额（不含手续费）</option></select><input id="size" aria-label="建仓规模" type="number" min="0.000001" step="any" value="100"></label><div class="row"><label>币种<select id="currency"><option>USD</option><option>JPY</option><option>CNY</option><option>HKD</option></select></label><label>买卖总手续费<input id="fees" type="number" min="0" step="any" value="0"></label></div><label>图表价格范围<select id="range"><option value="0.2">当前价 ±20%</option><option value="0.5" selected>当前价 ±50%</option><option value="1">当前价 0～200%</option><option value="2">当前价 0～300%</option></select></label><div id="position" class="hint"></div><div id="error" role="alert"></div><details><summary>行情接口（预留）</summary><label>股票代码<input id="symbol" placeholder="例如 AAPL" value="AAPL"></label><button id="fetchQuote">读取行情接口</button><p id="quoteStatus" class="hint">尚未连接行情源。示例数值仅用于计算。</p></details></aside><section><div class="cards"><div class="card"><div class="caption">当前净盈亏</div><div id="nowProfit" class="value"></div></div><div class="card"><div class="caption">当前收益率</div><div id="nowReturn" class="value"></div></div><div class="card"><div class="caption">保本股价</div><div id="breakEven" class="value"></div></div></div><div class="panel"><div class="charthead"><h2>目标股价 → 盈亏</h2><span class="caption" id="chartUnit"></span></div><canvas id="chart" aria-label="目标股价与净盈亏关系图。可使用下方目标价输入框读取精确结果。"></canvas><div class="details" aria-live="polite"><div><span class="caption">光标股价</span><strong id="hoverPrice"></strong></div><div><span class="caption">净盈亏</span><strong id="hoverProfit"></strong></div><div><span class="caption">相对当前价</span><strong id="hoverChange"></strong></div><div><span class="caption">持仓收益率</span><strong id="hoverReturn"></strong></div></div><p class="hint">移动鼠标或在图表上拖动查看；点击锁定竖线，再次点击解锁。虚线表示当前价。</p><div class="target"><label>精确目标股价<input id="target" type="number" min="0" step="any" value="60"></label><div><div class="caption">到达目标价时净盈亏</div><strong id="targetProfit"></strong><div id="targetChange" class="hint"></div></div></div></div><div class="panel" style="margin-top:18px"><h2>涨跌情景对比</h2><div class="tablewrap"><table><thead><tr><th>相对当前价</th><th>目标股价</th><th>净盈亏</th><th>比现在多赚 / 少赚</th><th>收益率</th></tr></thead><tbody id="scenarios"></tbody></table></div></div></section></div><footer>净盈亏 =（目标股价 − 建仓成本）× 股数 − 买卖总手续费；收益率以建仓金额＋总手续费为分母。投入金额模式允许小数股。不含税费、汇率变动和融资成本；不适用于按标的股价推算期权盈亏。</footer></main><script src="app.js"></script></body></html>
